<!DOCTYPE html>
<html>
<head>
    <title>AI Chatbot</title>
    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: #ece5dd;
        }
        .chat-container {
            width: 400px;
            height: 600px;
            background: #fff;
            margin: 20px auto;
            display: flex;
            flex-direction: column;
            border-radius: 10px;
            overflow: hidden;
        }
        .header {
            background: #5e073b;
            color: white;
            padding: 15px;
        }
        .chat-box {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            background: #e5ddd5;
            display: flex;
            flex-direction: column;
        }
        .message {
            margin: 10px 0;
            max-width: 70%;
            padding: 10px;
            border-radius: 10px;
        }
        .user {
            background: #f4c6f8;
            align-self: flex-end;
        }
        .bot {
            background: white;
            align-self: flex-start;
        }
        .input-box {
            display: flex;
            padding: 10px;
            background: #f0f0f0;
        }
        input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 5px;
        }
        button {
            padding: 10px;
            margin-left: 5px;
            background: #5e073b;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .top-btn {
            float: right;
            background: white;
            color: black;
            margin-left: 10px;
        }
    </style>
</head>
<body>
<div class="chat-container">
    <div class="header">
        AI Assistant 🤖
        <button class="top-btn" onclick="startNewChat()">New Chat</button>
    </div>
    <div class="chat-box" id="chatBox">
        {% if chat_history %}
            {% for msg in chat_history %}
                <div class="message {{ 'user' if msg.role=='user' else 'bot' }}">
                    {{ msg.content }}
                </div>
            {% endfor %}
        {% else %}
            <p style="text-align:center;">Start chatting...</p>
        {% endif %}
    </div>
    <div class="input-box">
        <input type="text" id="msg" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
    </div>
</div>
<script>
async function sendMessage() {
    let input = document.getElementById("msg");
    let message = input.value;
    if (!message) return;
    let chatBox = document.getElementById("chatBox");
    chatBox.innerHTML += `<div class="message user">${message}</div>`;
    input.value = "";
    let res = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });
    let data = await res.json();
    chatBox.innerHTML += `<div class="message bot">${data.reply}</div>`;
    chatBox.scrollTop = chatBox.scrollHeight;
}
document.getElementById("msg").addEventListener("keypress", function(e) {
    if (e.key === "Enter") sendMessage();
});
function startNewChat() {
    window.location.href = "/new_chat";
}
</script>

</body>
</html>
